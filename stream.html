<script>
// ============================================================
// STREAMBORNE ENGINE — downstream dodger. Pure logic, no DOM.
// ============================================================

// Lanes: player swipes between fixed lanes (feels responsive on mobile)
const ITEM = {
  ROCK: 'rock',       // obstacle
  TREE: 'tree',       // obstacle
  SAND: 'sand',       // obstacle (sandbar)
  LOG:  'log',        // obstacle
  COIN: 'coin',       // +points (good)
  GEM:  'gem',        // ++points (good, rarer)
  HEART:'heart',      // +1 heart (rare)
  FREEZE:'freeze',    // freeze obstacles 5s (rare)
};

const OBSTACLES = new Set([ITEM.ROCK, ITEM.TREE, ITEM.SAND, ITEM.LOG]);
const GOODIES = new Set([ITEM.COIN, ITEM.GEM, ITEM.HEART, ITEM.FREEZE]);

const ITEM_EMOJI = {
  rock:'🪨', tree:'🌲', sand:'🏖️', log:'🪵',
  coin:'🪙', gem:'💎', heart:'❤️', freeze:'❄️',
};

const ITEM_POINTS = { coin: 10, gem: 50 };

const CONFIG = {
  W: 440, H: 720,
  lanes: 5,
  maxHearts: 5,
  startHearts: 3,
  baseScrollSpeed: 2.6,    // px per frame (16ms) at level 1
  speedPerLevel: 0.45,
  levelDurationMs: 18000,  // each level lasts ~18s
  baseSpawnIntervalMs: 900,// time between spawned rows at level 1
  spawnSpeedupPerLevel: 70,// ms faster per level
  minSpawnIntervalMs: 320,
  invincibleMs: 1400,      // brief i-frames after a hit
  freezeMs: 5000,
  playerY: 0.82,           // player vertical position (fraction of H)
  itemRadius: 26,
  playerRadius: 28,
  // per-row, chance an obstacle cell vs goodie vs empty
  // tuned in playtest
  obstacleDensity: 0.34,   // chance each lane in a row has an obstacle
  goodieChance: 0.55,      // chance a row also drops a goodie
  heartRarity: 0.07,       // among goodies
  freezeRarity: 0.09,
  gemRarity: 0.20,
};

function rand(a,b){ return a + Math.random()*(b-a); }
function randint(a,b){ return Math.floor(rand(a,b+1)); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

let ENT_ID = 0;

class Entity {
  constructor(lane, y, type) {
    this.id = ENT_ID++;
    this.lane = lane;
    this.y = y;
    this.type = type;
    this.dead = false;
    this.collected = false;
    this.spawnY = y;
  }
  isObstacle(){ return OBSTACLES.has(this.type); }
  isGoodie(){ return GOODIES.has(this.type); }
}

class Game {
  constructor(config = {}) {
    this.cfg = { ...CONFIG, ...config };
    this.reset();
  }
  reset() {
    this.entities = [];
    this.score = 0;
    this.hearts = this.cfg.startHearts;
    this.playerLane = Math.floor(this.cfg.lanes / 2);
    this.gameOver = false;
    this.time = 0;
    this.level = 1;
    this.levelTime = 0;
    this.spawnTimer = 0;
    this.invincibleUntil = 0;
    this.frozenUntil = 0;
    this.events = [];
    this.coinsCollected = 0;
    this.gemsCollected = 0;
    this.heartsGained = 0;
    this.hitsTotal = 0;
    this.distance = 0;
    this.lastOpenLanes = null; // for gap continuity between rows
  }
  log(ev){ this.events.push(ev); }

  laneX(lane) {
    const margin = this.cfg.W * 0.08;
    const usable = this.cfg.W - margin*2;
    const step = usable / (this.cfg.lanes - 1);
    return margin + step * lane;
  }

  get scrollSpeed() {
    return this.cfg.baseScrollSpeed + (this.level - 1) * this.cfg.speedPerLevel;
  }
  get spawnInterval() {
    return Math.max(this.cfg.minSpawnIntervalMs,
      this.cfg.baseSpawnIntervalMs - (this.level - 1) * this.cfg.spawnSpeedupPerLevel);
  }
  isFrozen() { return this.time < this.frozenUntil; }
  isInvincible() { return this.time < this.invincibleUntil; }

  moveLeft() { if (this.playerLane > 0) { this.playerLane--; this.log({type:'move',dir:-1}); } }
  moveRight() { if (this.playerLane < this.cfg.lanes - 1) { this.playerLane++; this.log({type:'move',dir:1}); } }
  moveTo(lane) { this.playerLane = Math.max(0, Math.min(this.cfg.lanes-1, lane)); }

  spawnRow() {
    const lanes = this.cfg.lanes;
    // How many lanes to block this row — scales with level but capped to keep it fair
    const maxBlocked = Math.min(lanes - 1, 1 + Math.floor(this.level / 2));
    const minBlocked = this.level <= 1 ? 0 : 1;
    const numBlocked = randint(minBlocked, maxBlocked);

    // Determine which lanes stay OPEN. Guarantee continuity: at least one open lane
    // must be within reach of a previously-open lane so a path always exists.
    let guaranteedOpen;
    if (this.lastOpenLanes && this.lastOpenLanes.length) {
      // pick an anchor from last open lanes, keep it or a neighbor open
      const anchor = choice(this.lastOpenLanes);
      const drift = randint(-1, 1); // gap can shift by at most 1 lane per row → always reachable
      guaranteedOpen = Math.max(0, Math.min(lanes-1, anchor + drift));
    } else {
      guaranteedOpen = randint(0, lanes-1);
    }

    // Build blocked set, never blocking the guaranteed-open lane
    const blocked = new Set();
    let attempts = 0;
    while (blocked.size < numBlocked && attempts < 50) {
      const l = randint(0, lanes-1);
      if (l !== guaranteedOpen) blocked.add(l);
      attempts++;
    }

    const openLanes = [];
    for (let l = 0; l < lanes; l++) if (!blocked.has(l)) openLanes.push(l);
    this.lastOpenLanes = openLanes;

    for (const l of blocked) {
      const otype = choice([ITEM.ROCK, ITEM.TREE, ITEM.SAND, ITEM.LOG]);
      this.entities.push(new Entity(l, -40, otype));
    }

    // Maybe drop a goodie in an open lane
    if (Math.random() < this.cfg.goodieChance && openLanes.length) {
      const gl = choice(openLanes);
      let gtype = ITEM.COIN;
      const r = Math.random();
      if (r < this.cfg.heartRarity) gtype = ITEM.HEART;
      else if (r < this.cfg.heartRarity + this.cfg.freezeRarity) gtype = ITEM.FREEZE;
      else if (r < this.cfg.heartRarity + this.cfg.freezeRarity + this.cfg.gemRarity) gtype = ITEM.GEM;
      this.entities.push(new Entity(gl, -40, gtype));
    }
  }

  step(dt) {
    if (this.gameOver) return;
    this.time += dt;
    this.levelTime += dt;
    this.distance += this.scrollSpeed * (dt/16);

    // level up
    if (this.levelTime >= this.cfg.levelDurationMs) {
      this.levelTime = 0; this.level++; this.log({type:'levelup', level:this.level});
    }

    // spawn
    if (!this.isFrozen()) {
      this.spawnTimer += dt;
      if (this.spawnTimer >= this.spawnInterval) {
        this.spawnTimer = 0;
        this.spawnRow();
      }
    }

    // move entities downstream (toward player / bottom)
    const speed = this.isFrozen() ? 0 : this.scrollSpeed * (dt/16);
    const playerYpx = this.cfg.H * this.cfg.playerY;
    for (const e of this.entities) {
      e.y += speed;
      if (e.y > this.cfg.H + 50) e.dead = true;
      // collision check around player row
      if (!e.dead && !e.collected) {
        const dy = Math.abs(e.y - playerYpx);
        if (e.lane === this.playerLane && dy < (this.cfg.itemRadius + this.cfg.playerRadius) * 0.6) {
          this.handleHit(e);
        }
      }
    }
    this.entities = this.entities.filter(e => !e.dead);

    if (this.hearts <= 0 && !this.gameOver) {
      this.gameOver = true;
      this.log({type:'gameover'});
    }
  }

  handleHit(e) {
    if (e.isGoodie()) {
      e.collected = true; e.dead = true;
      switch (e.type) {
        case ITEM.COIN: this.score += ITEM_POINTS.coin; this.coinsCollected++; this.log({type:'coin', lane:e.lane}); break;
        case ITEM.GEM: this.score += ITEM_POINTS.gem; this.gemsCollected++; this.log({type:'gem', lane:e.lane}); break;
        case ITEM.HEART:
          if (this.hearts < this.cfg.maxHearts) { this.hearts++; this.heartsGained++; }
          this.log({type:'heart', lane:e.lane}); break;
        case ITEM.FREEZE:
          this.frozenUntil = this.time + this.cfg.freezeMs; this.log({type:'freeze', lane:e.lane}); break;
      }
    } else {
      // obstacle
      if (this.isInvincible()) return;
      this.hearts--; this.hitsTotal++;
      this.invincibleUntil = this.time + this.cfg.invincibleMs;
      e.dead = true; // obstacle consumed on hit
      this.log({type:'hit', lane:e.lane, heartsLeft:this.hearts});
    }
  }
}

// Leaderboard (in-memory, seeded with some defaults)
function makeLeaderboard() {
  return [
    { name:'OTTER', score:1200 }, { name:'HERON', score:980 }, { name:'TROUT', score:870 },
    { name:'NEWT',  score:640 }, { name:'CARP',  score:520 }, { name:'PIKE', score:410 },
    { name:'EEL',   score:300 }, { name:'CRAB',  score:210 }, { name:'FROG', score:120 },
    { name:'MINNOW',score:60 },
  ];
}




// ===================== RENDER + INPUT =====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let DPR = 1, VW = 0, VH = 0;
let game = new Game();
let leaderboard = makeLeaderboard();
let critter = '🦦';
let running = false;
let lastTime = performance.now();
let bgScroll = 0;
let splashes = [];
let floatTexts = [];
let shake = 0;
let lastScoreShown = 0;
let pendingScore = null; // {score, level} awaiting name save

const CRITTERS = ['🦦','🦆','🐸','🐢','🦫','🦢'];

function resize() {
  const wrap = document.getElementById('wrap');
  const rect = wrap.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = rect.width; VH = rect.height;
  canvas.width = VW * DPR; canvas.height = VH * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  game.cfg.W = VW; game.cfg.H = VH;
}
window.addEventListener('resize', resize);

// ---- decorative river background that scrolls toward viewer (downward) ----
const bgRocks = [];
function seedBg() {
  bgRocks.length = 0;
  for (let i=0;i<24;i++) bgRocks.push({ x:Math.random(), y:Math.random(), s:rand(2,7), type:Math.random() });
}
seedBg();

function drawBackground(dt) {
  // water gradient
  const g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#2a8fb0'); g.addColorStop(0.5,'#1f7a9a'); g.addColorStop(1,'#176580');
  ctx.fillStyle = g; ctx.fillRect(0,0,VW,VH);

  // scroll speed tied to game speed for the floating illusion
  const spd = (running && !game.isFrozen() ? game.scrollSpeed : 1.2) * (dt/16);
  bgScroll = (bgScroll + spd);

  // flowing current streaks (parallax, move downward)
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = '#bfefff';
  const streakH = 120, gap = 70;
  for (let layer=0; layer<2; layer++) {
    const lspd = layer===0?1:0.5;
    const off = (bgScroll*lspd) % gap;
    for (let y=-gap; y<VH+gap; y+=gap) {
      for (let x=20; x<VW; x+=110) {
        const yy = y + off;
        ctx.beginPath();
        ctx.ellipse(x + (layer*55), yy, 26, 5, 0, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }
  ctx.restore();

  // faint sparkles drifting down
  ctx.save(); ctx.globalAlpha=0.5;
  for (const r of bgRocks) {
    r.y += (spd*0.012);
    if (r.y > 1.05) { r.y = -0.05; r.x = Math.random(); }
    ctx.fillStyle = r.type>0.5 ? 'rgba(255,255,255,0.4)':'rgba(180,240,255,0.5)';
    ctx.beginPath();
    ctx.arc(r.x*VW, r.y*VH, r.s*0.5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // riverbank edges
  ctx.fillStyle = 'rgba(60,120,70,0.45)';
  ctx.fillRect(0,0,VW*0.04,VH);
  ctx.fillRect(VW*0.96,0,VW*0.04,VH);
}

function laneToX(lane){ return game.laneX(lane); }

function drawEntity(e) {
  const x = laneToX(e.lane);
  const y = e.y;
  const r = game.cfg.itemRadius;
  const emoji = ITEM_EMOJI[e.type];
  ctx.save();
  // goodie glow
  if (e.isGoodie()) {
    const pulse = 0.5 + Math.sin(performance.now()*0.005 + e.id)*0.3;
    const col = e.type==='heart'?'255,90,120':e.type==='gem'?'120,220,255':e.type==='freeze'?'150,235,255':'255,215,80';
    const gr = ctx.createRadialGradient(x,y,2,x,y,r*1.6);
    gr.addColorStop(0,'rgba('+col+','+pulse+')'); gr.addColorStop(1,'rgba('+col+',0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,r*1.6,0,Math.PI*2); ctx.fill();
  } else {
    // obstacle subtle shadow on water
    ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.beginPath();
    ctx.ellipse(x,y+r*0.55,r*0.8,r*0.35,0,0,Math.PI*2); ctx.fill();
  }
  ctx.font = (r*1.7)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(emoji, x, y);
  ctx.restore();
}

function drawPlayer() {
  const x = laneToX(game.playerLane);
  const y = VH * game.cfg.playerY;
  const r = game.cfg.playerRadius;
  // smooth lane glide
  player.curX += (x - player.curX) * 0.35;
  const px = player.curX;
  const bobY = y + Math.sin(performance.now()*0.006)*4;
  // wake / ripple
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2;
  const wake=(performance.now()*0.02)%20;
  for(let i=0;i<2;i++){ ctx.globalAlpha=0.3-i*0.12; ctx.beginPath();
    ctx.ellipse(px, bobY+r*0.7+wake+i*12, r*0.7-i*4, r*0.3, 0, 0, Math.PI*2); ctx.stroke(); }
  ctx.restore();
  // invincibility flicker
  let alpha = 1;
  if (game.isInvincible()) alpha = 0.4 + Math.sin(performance.now()*0.03)*0.4;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.font = (r*2)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(critter, px, bobY);
  ctx.restore();
}
const player = { curX: 0 };

function processEvents() {
  for (const ev of game.events) {
    if (ev.type==='coin'){ floatText(laneToX(ev.lane), VH*game.cfg.playerY, '+10', '#ffe066'); splash(ev.lane,'#ffe066'); }
    else if (ev.type==='gem'){ floatText(laneToX(ev.lane), VH*game.cfg.playerY, '+50', '#7fdcff', true); splash(ev.lane,'#7fdcff'); }
    else if (ev.type==='heart'){ floatText(laneToX(ev.lane), VH*game.cfg.playerY, '+❤️', '#ff5a78', true); splash(ev.lane,'#ff5a78'); }
    else if (ev.type==='freeze'){ showFreeze(); flashToast('❄️ FROZEN'); }
    else if (ev.type==='hit'){ shake=14; splash(ev.lane,'#ff4040'); flashToast('💥 −❤️'); }
    else if (ev.type==='levelup'){ showLevel(ev.level); }
    else if (ev.type==='gameover'){ endGame(); }
  }
  game.events.length = 0;
}
function floatText(x,y,t,c,big){ floatTexts.push({x,y,t,c,big,life:1}); }
function splash(lane,c){ const x=laneToX(lane),y=VH*game.cfg.playerY;
  for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=rand(1,4);
    splashes.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
let toastTimer=0;
function flashToast(t){ const el=document.getElementById('toastEl')||makeToast(); el.textContent=t; el.style.opacity='1'; toastTimer=700; }
function makeToast(){ const d=document.createElement('div'); d.className='toast'; d.id='toastEl'; d.style.opacity='0';
  d.style.transition='opacity 0.3s'; document.getElementById('wrap').appendChild(d); return d; }
function showLevel(n){ const b=document.getElementById('levelBadge'); b.textContent='Level '+n; b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),1600); }
function showFreeze(){ document.getElementById('freezeBar').classList.add('show'); }

function updateHud() {
  if (game.score !== lastScoreShown) {
    const el=document.getElementById('score'); el.textContent=game.score;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    lastScoreShown=game.score;
  }
  const h=document.getElementById('hearts');
  h.textContent = '❤️'.repeat(Math.max(0,game.hearts)) + '🖤'.repeat(Math.max(0,game.cfg.maxHearts>game.hearts?0:0));
  // freeze bar visibility
  if (!game.isFrozen()) document.getElementById('freezeBar').classList.remove('show');
}

function loop(now) {
  const dt = Math.min(40, now-lastTime); lastTime=now;
  ctx.save();
  if (shake>0.2){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.85; }
  drawBackground(dt);

  if (running && !game.gameOver) {
    game.step(dt);
    processEvents();
    updateHud();
  }

  // entities sorted by y so nearer ones draw on top
  const ents=[...game.entities].sort((a,b)=>a.y-b.y);
  for (const e of ents) drawEntity(e);
  if (running) drawPlayer();

  // splashes
  splashes = splashes.filter(s=>{ s.x+=s.vx; s.y+=s.vy; s.vy+=0.15; s.life-=dt*0.003;
    if(s.life<=0)return false; ctx.globalAlpha=s.life; ctx.fillStyle=s.c;
    ctx.beginPath(); ctx.arc(s.x,s.y,3*s.life,0,Math.PI*2); ctx.fill(); return true; });
  ctx.globalAlpha=1;
  // float texts
  floatTexts = floatTexts.filter(f=>{ f.life-=dt*0.0016; if(f.life<=0)return false;
    ctx.globalAlpha=Math.min(1,f.life); ctx.fillStyle=f.c; ctx.font='800 '+(f.big?30:22)+'px Baloo 2, cursive';
    ctx.textAlign='center'; ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=6;
    ctx.fillText(f.t,f.x,f.y-40-(1-f.life)*40); ctx.shadowBlur=0; ctx.globalAlpha=1; return true; });

  if (toastTimer>0){ toastTimer-=dt; if(toastTimer<=0){const el=document.getElementById('toastEl'); if(el)el.style.opacity='0';}}

  ctx.restore();
  requestAnimationFrame(loop);
}

// ---- input: swipe + tap halves + keyboard ----
let touchStartX=null, touchStartT=0;
function onStart(e){ if(!running)return; const t=e.touches?e.touches[0]:e; touchStartX=t.clientX; touchStartT=Date.now(); }
function onEnd(e){ if(!running||touchStartX===null)return; const t=e.changedTouches?e.changedTouches[0]:e;
  const dx=t.clientX-touchStartX; const dt=Date.now()-touchStartT;
  if(Math.abs(dx)>24){ if(dx<0)game.moveLeft(); else game.moveRight(); }
  else if(dt<250){ // tap: move toward tapped side
    const rect=canvas.getBoundingClientRect(); const rel=t.clientX-rect.left;
    if(rel<rect.width/2)game.moveLeft(); else game.moveRight(); }
  touchStartX=null;
}
canvas.addEventListener('touchstart',onStart,{passive:true});
canvas.addEventListener('touchend',onEnd,{passive:true});
canvas.addEventListener('mousedown',onStart);
canvas.addEventListener('mouseup',onEnd);
window.addEventListener('keydown',e=>{ if(!running)return;
  if(e.key==='ArrowLeft'||e.key==='a')game.moveLeft();
  if(e.key==='ArrowRight'||e.key==='d')game.moveRight(); });

// ---- game flow ----
function startGame() {
  game = new Game(); resize(); player.curX = laneToX(game.playerLane);
  splashes=[]; floatTexts=[]; lastScoreShown=0;
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameover').classList.remove('show');
  updateHud();
  running = true;
}
function endGame() {
  running = false;
  pendingScore = { score: game.score, level: game.level };
  document.getElementById('finalScore').textContent = game.score;
  document.getElementById('finalLevel').textContent = game.level;
  // does it make top 10?
  const lowest = leaderboard[leaderboard.length-1];
  const makesIt = leaderboard.length<10 || game.score > lowest.score;
  document.getElementById('nameEntry').style.display = makesIt ? 'flex' : 'none';
  document.getElementById('goTag').textContent = makesIt ? 'a new high voyage! enter your name' : 'the current got you';
  renderLeaderboard(makesIt ? game.score : null);
  document.getElementById('gameover').classList.add('show');
  if (makesIt) setTimeout(()=>document.getElementById('nameInput').focus(), 300);
}
function renderLeaderboard(highlightScore) {
  const body=document.getElementById('lbBody'); body.innerHTML='';
  const sorted=[...leaderboard].sort((a,b)=>b.score-a.score).slice(0,10);
  sorted.forEach((row,i)=>{
    const div=document.createElement('div');
    div.className='lb-row'+(row.score===highlightScore&&row._you?' you':'');
    div.innerHTML='<span class="rank">'+(i+1)+'</span><span class="nm">'+row.name+'</span><span class="sc">'+row.score+'</span>';
    body.appendChild(div);
  });
}
function saveScore() {
  if (!pendingScore) return;
  let name=(document.getElementById('nameInput').value||'YOU').toUpperCase().slice(0,6);
  leaderboard.push({ name, score: pendingScore.score, _you:true });
  leaderboard.sort((a,b)=>b.score-a.score);
  leaderboard=leaderboard.slice(0,10);
  document.getElementById('nameEntry').style.display='none';
  renderLeaderboard(pendingScore.score);
  pendingScore=null;
}

// build critter picker
const pickRow=document.getElementById('pickRow');
CRITTERS.forEach((c,i)=>{ const d=document.createElement('div'); d.className='pick'+(i===0?' sel':'');
  d.textContent=c; d.addEventListener('click',()=>{ critter=c;
    document.getElementById('startCreature').textContent=c;
    [...pickRow.children].forEach(ch=>ch.classList.remove('sel')); d.classList.add('sel'); });
  pickRow.appendChild(d); });

document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('playAgain').addEventListener('click',startGame);
document.getElementById('saveScore').addEventListener('click',saveScore);
document.getElementById('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter')saveScore(); });

resize();
player.curX = laneToX(game.playerLane);
requestAnimationFrame(loop);
</script>
